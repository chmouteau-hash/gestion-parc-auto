<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if erreur.is_some() %}Erreur : {% endif %}Connexion · Parc automobile</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="contenu contenu-etroit">
  <h1>Parc automobile</h1>
  <p>Connectez-vous pour accéder au suivi du parc.</p>
  {% if let Some(e) = erreur %}
  <p class="message-erreur" role="alert">{{ e }}</p>
  {% endif %}
  <form method="post" action="/connexion" class="formulaire">
    <label>Identifiant
      <input type="text" name="login" value="{{ login }}" required autofocus autocomplete="username">
    </label>
    <label>Mot de passe
      <input type="password" name="mot_de_passe" required autocomplete="current-password">
    </label>
    <div class="actions">
      <button type="submit" class="bouton">Se connecter</button>
    </div>
  </form>
</main>
</body>
</html>
