<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if erreur.is_some() %}Erreur : {% endif %}Connexion · {{ profil.marque() }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ profil.icone() }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ profil.icone_application(180) }}">
  <meta name="theme-color" content="{{ profil.couleur_theme() }}">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="contenu contenu-etroit">
  <p class="marque"><img class="logo logo-grand" src="{{ profil.logo() }}" alt="{{ profil.marque() }}"></p>
  <h1>Connexion</h1>
  <p>Connectez-vous pour accéder au suivi du parc.</p>
  {% if let Some(e) = erreur %}
  <p class="message-erreur" role="alert">{{ e }}</p>
  {% endif %}
  <form method="post" action="/connexion" class="formulaire">
    <label>Identifiant
      <input type="text" name="login" value="{{ login }}" required autofocus autocomplete="username">
    </label>
    <label>Mot de passe
      <input type="password" name="mot_de_passe" required autocomplete="current-password">
    </label>
    <div class="actions">
      <button type="submit" class="bouton">Se connecter</button>
    </div>
  </form>
</main>
</body>
</html>
