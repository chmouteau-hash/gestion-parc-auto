[package]
name = "gestion-parc-auto"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Gestion du parc automobile d'une entreprise : véhicules, conducteurs, affectations, entretien, échéances."
license = "UNLICENSED"
publish = false

# Le projet est à la fois une bibliothèque (le code applicatif, testable depuis tests/)
# et un exécutable (src/main.rs, qui ne fait que lire la configuration et démarrer).
[lib]
path = "src/lib.rs"

[[bin]]
name = "gestion-parc-auto"
path = "src/main.rs"

[dependencies]
# Serveur HTTP. "multipart" sert au dépôt de documents (formulaire avec fichier).
axum = { version = "0.8", features = ["multipart"] }
# Cookies chiffrés pour la session de connexion.
axum-extra = { version = "0.10", features = ["cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
# Journal des requêtes HTTP.
tower-http = { version = "0.6", features = ["trace", "timeout"] }
# Accès PostgreSQL asynchrone, migrations embarquées, dates chrono.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate"] }
# Templates HTML compilés avec le programme : une erreur de template casse la compilation, pas la page.
askama = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Hachage des mots de passe.
argon2 = { version = "0.5", features = ["std"] }
# Nom de fichier aléatoire pour les documents déposés.
uuid = { version = "1", features = ["v4"] }
# Vignette de la photo du véhicule, calculée au dépôt (JPEG, PNG, WebP lus ; JPEG écrit). Sans les
# autres formats ni les décodeurs parallèles : l'exécutable reste léger.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Lecture du fichier .env en développement.
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
# Pour appeler le routeur Axum directement dans les tests, sans ouvrir de port réseau.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
